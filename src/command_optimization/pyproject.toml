[project]
name = "bfm-ttc"
version = "0.1.0"
description = "Receding-horizon motion command optimization runtime"
requires-python = ">=3.10"
dependencies = [
    "mujoco==3.7.0",
    "mujoco-warp==3.5.0.2",
    "numpy>=1.26",
    "onnx==1.22.0",
    "opencv-python-headless>=4.10",
    "pyyaml>=6",
    "sampling-optimizers",
    "bfm-adapters",
    "warp-lang==1.12.0",
]

[project.scripts]
bfm-ttc = "command_optimization.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["command_optimization"]
