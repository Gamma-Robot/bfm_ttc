[project]
name = "bfm-adapters"
version = "0.1.0"
description = "Frozen BFM observation, state and action adapters"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "onnxruntime-gpu[cuda,cudnn]==1.23.2",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bfm_adapters"]
